<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Out of search engines and AI crawlers; link previews (WhatsApp) read the og: tags and are not affected -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai">
  <!-- Visits, with GoatCounter: no cookies, no personal data. no_onload: the views are counted one by one
       by src/lib/analytics.ts, as they live after the "#" -->
  <script data-goatcounter="https://scacchiandchill.goatcounter.com/count" data-goatcounter-settings='{"no_onload": true}' async src="https://gc.zgo.at/count.js"></script>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f1ede3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121714" media="(prefers-color-scheme: dark)">
  <title>Scacchi and Chill – Torneo di scacchi tra amici</title>
  <meta name="description" content="Scacchi and Chill: accoppiamenti, risultati Lichess e classifica del torneo di scacchi tra amici.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="it_IT">
  <meta property="og:site_name" content="Scacchi and Chill">
  <meta property="og:title" content="Scacchi and Chill – Torneo di scacchi tra amici">
  <meta property="og:description" content="Accoppiamenti, risultati Lichess e classifica del torneo.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
  <!-- PNG and ICO first: link preview services (Linktree, WhatsApp) often ignore SVG icons -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- Firefox for Android paints an installed app's navigation bar black or white from the
       manifest background_color, which has no light/dark variants: pick the manifest that
       matches the theme. It must run during parsing, before the browser reads the manifest. -->
  <script>
    if (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) {
      var m = document.querySelector('link[rel="manifest"]');
      m.href = m.href.replace("manifest.webmanifest", "manifest-light.webmanifest");
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
