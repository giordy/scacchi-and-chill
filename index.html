<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f3a34">
<title>Round pairings</title>
<style>
  :root {
    --bg: #e8ece9;
    --panel: #f7f9f7;
    --ink: #17231f;
    --muted: #5a6b64;
    --line: #c5d0ca;
    --accent: #1f3a34;
    --accent-ink: #f2f6f3;
    --danger: #a3302a;
    --ok: #2c6a4a;
    --square-a: #dfe6e1;
    --square-b: #bccbc2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121a17;
      --panel: #1b2622;
      --ink: #e6eee9;
      --muted: #93a59c;
      --line: #32423b;
      --accent: #8fc4ae;
      --accent-ink: #10201a;
      --danger: #ee8a82;
      --ok: #8fc4ae;
      --square-a: #223029;
      --square-b: #2c3d34;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font: 600 28px/1.15 Georgia, "Iowan Old Style", "Times New Roman", serif; margin: 4px 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .strip { height: 10px; border-radius: 3px; margin: 0 0 18px;
    background: repeating-linear-gradient(90deg, var(--square-a) 0 20px, var(--square-b) 20px 40px); }

  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  input[type=text], input[type=password], input[type=number], select, textarea {
    width: 100%; min-height: 48px; font: inherit; font-size: 16px; /* 16px prevents iOS zoom */
    color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  }
  select:disabled { opacity: 0.75; }
  textarea { min-height: 220px; font-size: 15px; line-height: 1.4; resize: vertical; }
  textarea.small { min-height: 84px; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .game { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .game h2 { font-size: 16px; font-weight: 600; margin: 0 0 10px; display: flex; justify-content: space-between; }
  .game .state { font-size: 14px; font-weight: 500; color: var(--ok); }
  .pair { display: grid; grid-template-columns: 1fr 48px; gap: 8px; align-items: end; }
  .selects { display: grid; gap: 8px; }
  .side { display: grid; grid-template-columns: 28px 1fr; align-items: center; gap: 8px; }
  .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--ink); justify-self: center; }
  .dot.w { background: #fff; }
  .dot.b { background: #111; }
  .swap { min-height: 48px; height: 100%; border: 1px solid var(--line); background: transparent;
    color: var(--ink); border-radius: 8px; font-size: 20px; cursor: pointer; }
  .swap:disabled { opacity: 0.4; cursor: default; }
  .progress { color: var(--muted); margin: 4px 0 14px; }

  button.primary, a.primary { display: block; width: 100%; min-height: 52px; text-align: center; text-decoration: none;
    font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 10px; padding: 14px 16px; cursor: pointer; }
  button.primary:disabled { opacity: 0.45; cursor: default; }
  button.secondary { min-height: 48px; font: inherit; font-weight: 500; background: transparent; color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
  .actions { display: grid; gap: 10px; margin-top: 10px; }
  .actions.two { grid-template-columns: 1fr 1fr; }

  details { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px 12px; margin: 18px 0; }
  summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 500; }
  details .body { padding: 4px 0 14px; display: grid; gap: 12px; }
  .inline { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .inline input { width: 22px; height: 22px; }
  .inline label { margin: 0; color: var(--ink); font-size: 16px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .note { font-size: 14px; color: var(--muted); margin: 0; }
  .note code { background: var(--bg); padding: 1px 5px; border-radius: 4px; }

  .notice { margin: 14px 0 0; padding: 12px; border-radius: 8px; font-size: 15px; }
  .notice.err { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); border: 1px solid var(--danger); }
  .notice.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); border: 1px solid var(--ok); }
  .notice ul { margin: 6px 0 0 18px; padding: 0; }

  .result { margin-top: 24px; }
  .result h2 { font: 600 20px/1.2 Georgia, "Iowan Old Style", serif; margin: 0 0 10px; }
</style>
</head>
<body>
<div id="root"></div>

<!-- React + in-browser JSX (no build step). Versions are pinned. -->
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ====================================================================
   CONFIG – loaded from config.json (same folder as this page)
   Players, message texts, status phrases and defaults live there.
==================================================================== */

// Filled in by applyConfig() before the app is drawn.
let PLAYERS, DEFAULT_TEMPLATES, TYPE_LABELS, CHALLENGE_NAME, KEYCAPS, STATUS_PHRASES, DEFAULT_SETTINGS, GAME_COUNT;

// Extra Lichess game rules (sent as the "rules" parameter). Which ones are on by default is set in config.json.
const RULES = [
  { key: "noRematch", label: "No rematch offers" },
  { key: "noGiveTime", label: "No giving time to the opponent" },
  { key: "noClaimWin", label: "No claiming victory if the opponent leaves" },
  { key: "noEarlyDraw", label: "No early draws (draw offers blocked early in the game)" },
];

function applyConfig(cfg) {
  const fail = (msg) => { throw new Error("config.json: " + msg); };
  const isText = (v) => typeof v === "string";
  const isTextList = (v) => Array.isArray(v) && v.length > 0 && v.every(isText);

  if (!Array.isArray(cfg.players) || cfg.players.length < 2 || cfg.players.some((p) => !p || !isText(p.handle) || !p.handle.trim())) {
    fail('"players" must be a list of at least 2 entries like { "handle": "lichess_username", "name": "Name" }.');
  }
  const handles = cfg.players.map((p) => p.handle.trim().toLowerCase());
  if (new Set(handles).size !== handles.length) fail('"players" contains the same handle twice.');

  const t = cfg.messageTemplates;
  if (!t || !["header", "game", "bye", "footer"].every((k) => isText(t[k]))) {
    fail('"messageTemplates" needs the text fields "header", "game", "bye" and "footer".');
  }
  if (!cfg.typeLabels || !isText(cfg.typeLabels.rated) || !isText(cfg.typeLabels.casual)) {
    fail('"typeLabels" needs "rated" and "casual".');
  }
  if (!isText(cfg.challengeName)) fail('"challengeName" must be text.');

  const sp = cfg.statusPhrases;
  const spKeys = ["header", "ongoing", "win", "draw", "aborted", "pending", "footer", "closing"];
  const badKey = sp && spKeys.find((k) => !isTextList(sp[k]));
  if (!sp || badKey) fail(`"statusPhrases.${badKey ?? "…"}" must be a non-empty list of texts.`);
  if (sp.highlight !== undefined && !isTextList(sp.highlight)) fail('"statusPhrases.highlight" must be a non-empty list of texts (or left out).');

  const d = cfg.defaults ?? {};
  const days = Number(d.days ?? 2);
  const expiry = Number(d.expiry ?? 2);
  if (!Number.isInteger(days) || days < 1 || days > 14) fail('"defaults.days" must be a whole number from 1 to 14.');
  if (!Number.isInteger(expiry) || expiry < 1 || expiry > 14) fail('"defaults.expiry" must be a whole number from 1 to 14.');

  PLAYERS = cfg.players.map((p) => ({ handle: p.handle.trim(), name: (isText(p.name) && p.name.trim()) || p.handle.trim() }));
  DEFAULT_TEMPLATES = { header: t.header, game: t.game, bye: t.bye, footer: t.footer };
  TYPE_LABELS = { rated: cfg.typeLabels.rated, casual: cfg.typeLabels.casual };
  CHALLENGE_NAME = cfg.challengeName;
  KEYCAPS = isTextList(cfg.numberEmojis) ? cfg.numberEmojis : [];
  STATUS_PHRASES = sp;
  DEFAULT_SETTINGS = {
    token: "",
    days,
    expiry,
    rated: d.rated !== false,
    rules: Object.fromEntries(RULES.map(({ key }) => [key, !!d.rules?.[key]])),
  };
  GAME_COUNT = Math.floor(PLAYERS.length / 2);
}

// Settings saved in the browser only hold what you changed (plus the token); everything else follows config.json.
// Older versions stored a full copy: keep just the token from it.
function initialStoredSettings() {
  for (const key of ["pairings.settings.v2", "pairings.settings"]) {
    try {
      const old = JSON.parse(localStorage.getItem(key));
      if (old?.token) return { token: old.token };
    } catch (e) {}
  }
  return {};
}

/* ====================================================================
   HELPERS
==================================================================== */

const nameOf = (handle) => PLAYERS.find((p) => p.handle === handle)?.name ?? handle;

// "Turno {round}" + {round: 3}  ->  "Turno 3". Unknown placeholders are left untouched.
const fill = (template, vars) =>
  template.replace(/\{(\w+)\}/g, (match, key) => (key in vars ? vars[key] : match));

const emptyPairs = () => Array.from({ length: GAME_COUNT }, () => ({ white: "", black: "", url: "" }));

const clampDays = (value, fallback) => {
  const n = parseInt(value, 10);
  return Number.isFinite(n) ? Math.min(14, Math.max(1, n)) : fallback;
};

// useState that survives page reloads (localStorage). Safe if storage is unavailable.
function usePersistentState(key, initial, isValid = () => true) {
  const [value, setValue] = useState(() => {
    try {
      const raw = localStorage.getItem(key);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (isValid(parsed)) return parsed;
      }
    } catch (e) {}
    return typeof initial === "function" ? initial() : initial;
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }, [key, value]);
  return [value, setValue];
}

// byes = names of the players not placed in any game this round
function buildMessage({ pairs, round, settings, templates, byes }) {
  const created = pairs.filter((p) => p.url);
  if (created.length === 0) return "";
  const common = {
    round,
    days: settings.days,
    expiry: settings.expiry,
    type: settings.rated ? TYPE_LABELS.rated : TYPE_LABELS.casual,
    bye: byes.join(", "),
  };
  const games = created.map((p, i) =>
    fill(templates.game, {
      ...common,
      n: KEYCAPS[i] ?? `${i + 1}.`,
      white: nameOf(p.white),
      black: nameOf(p.black),
      url: p.url,
    })
  );
  const byeLine = byes.length > 0 ? fill(templates.bye, common) : "";
  return [fill(templates.header, common), ...games, byeLine, fill(templates.footer, common)]
    .filter((part) => part.trim() !== "")
    .join("\n\n");
}

// Lichess call: one open challenge restricted to two players (first one gets white).
async function createChallenge(pair, { round, settings }) {
  const body = new URLSearchParams({
    users: `${pair.white},${pair.black}`,
    rated: String(settings.rated),
    days: String(settings.days),
    name: fill(CHALLENGE_NAME, { round }),
    expiresAt: String(Date.now() + settings.expiry * 86400000),
  });
  const rules = RULES.map((r) => r.key).filter((key) => settings.rules?.[key]);
  if (rules.length > 0) body.set("rules", rules.join(","));
  const res = await fetch("https://lichess.org/api/challenge/open", {
    method: "POST",
    headers: {
      Authorization: "Bearer " + settings.token,
      "Content-Type": "application/x-www-form-urlencoded",
    },
    body,
  });
  if (!res.ok) {
    const detail = (await res.text().catch(() => "")).slice(0, 200);
    const hint =
      res.status === 401 ? "Token missing, wrong or expired." :
      res.status === 429 ? "Lichess rate limit: wait a minute and retry." : "";
    throw new Error(`HTTP ${res.status}. ${hint} ${detail}`.trim());
  }
  const data = await res.json();
  const url = (data.challenge ?? data).url;
  if (!url) throw new Error("Lichess answered without a link.");
  return url;
}

/* ====================================================================
   COMPONENTS
==================================================================== */

function PlayerSelect({ color, label, value, players, disabled, onChange }) {
  return (
    <div className="side">
      <span className={"dot " + (color === "white" ? "w" : "b")} title={color} />
      <select aria-label={label} value={value} disabled={disabled} onChange={(e) => onChange(e.target.value)}>
        <option value="">{color === "white" ? "White…" : "Black…"}</option>
        {players.map((p) => (
          <option key={p.handle} value={p.handle}>{p.name}</option>
        ))}
      </select>
    </div>
  );
}

function GameCard({ index, pair, available, onChange, onSwap }) {
  const locked = !!pair.url;
  return (
    <div className="game">
      <h2>
        <span>Game {index + 1}</span>
        <span className="state">{locked ? "Created" : ""}</span>
      </h2>
      <div className="pair">
        <div className="selects">
          <PlayerSelect color="white" label={`Game ${index + 1} white`} value={pair.white}
            players={available(pair.white)} disabled={locked} onChange={(v) => onChange({ white: v })} />
          <PlayerSelect color="black" label={`Game ${index + 1} black`} value={pair.black}
            players={available(pair.black)} disabled={locked} onChange={(v) => onChange({ black: v })} />
        </div>
        <button className="swap" type="button" disabled={locked} onClick={onSwap}
          aria-label={`Swap colors in game ${index + 1}`}>⇅</button>
      </div>
    </div>
  );
}

function Notice({ notice }) {
  if (!notice) return null;
  return (
    <div className={"notice " + notice.kind} role="status" aria-live="polite">
      {notice.text}
      {notice.items && <ul>{notice.items.map((t, i) => <li key={i}>{t}</li>)}</ul>}
    </div>
  );
}

// Number field for 1-14 days. Keeps what you type as text, so it can be emptied and retyped on a phone;
// the value is saved as soon as it is valid, and corrected when you leave the field.
function DaysField({ id, label, value, fallback, onCommit }) {
  const [text, setText] = useState(String(value));
  useEffect(() => setText(String(value)), [value]);

  const handleChange = (e) => {
    const raw = e.target.value.replace(/\D/g, "").slice(0, 2);
    setText(raw);
    const n = parseInt(raw, 10);
    if (n >= 1 && n <= 14) onCommit(n);
  };
  const handleBlur = () => {
    const n = clampDays(text, fallback);
    if (n !== value) onCommit(n);
    setText(String(n));
  };

  return (
    <div>
      <label htmlFor={id}>{label}</label>
      <input id={id} type="text" inputMode="numeric" pattern="[0-9]*" autoComplete="off"
        value={text} onChange={handleChange} onBlur={handleBlur} onFocus={(e) => e.target.select()} />
    </div>
  );
}

function SettingsPanel({ settings, setSettings, templates, setTemplates, flash, panelRef }) {
  const [tokenDraft, setTokenDraft] = useState(settings.token);
  const set = (patch) => setSettings((s) => ({ ...s, ...patch }));
  const setTemplate = (key, text) => setTemplates((t) => ({ ...(t ?? {}), [key]: text }));

  return (
    <details ref={panelRef}>
      <summary>Settings</summary>
      <div className="body">
        <div>
          <label htmlFor="token">Lichess API token</label>
          <input id="token" type="password" autoComplete="off" placeholder="lip_…"
            value={tokenDraft} onChange={(e) => setTokenDraft(e.target.value)} />
          <p className="note">Create one at lichess.org/account/oauth/token with the challenge scope. It is stored only in this browser.</p>
        </div>
        <div className="actions two" style={{ marginTop: 0 }}>
          <button className="secondary" type="button"
            onClick={() => { set({ token: tokenDraft.trim() }); flash("ok", "Token saved in this browser."); }}>
            Save token
          </button>
          <button className="secondary" type="button"
            onClick={() => { setTokenDraft(""); set({ token: "" }); flash("ok", "Token removed from this browser."); }}>
            Forget token
          </button>
        </div>
        <div className="grid2">
          <DaysField id="days" label="Days per move" value={settings.days}
            fallback={2} onCommit={(n) => set({ days: n })} />
          <DaysField id="expiry" label="Link valid for (days)" value={settings.expiry}
            fallback={2} onCommit={(n) => set({ expiry: n })} />
        </div>
        <div className="inline">
          <input id="rated" type="checkbox" checked={settings.rated} onChange={(e) => set({ rated: e.target.checked })} />
          <label htmlFor="rated">Rated games</label>
        </div>

        <div>
          <label>Game rules</label>
          {RULES.map(({ key, label }) => (
            <div className="inline" key={key}>
              <input id={"rule-" + key} type="checkbox" checked={!!settings.rules?.[key]}
                onChange={(e) => set({ rules: { ...settings.rules, [key]: e.target.checked } })} />
              <label htmlFor={"rule-" + key}>{label}</label>
            </div>
          ))}
        </div>

        <hr style={{ border: 0, borderTop: "1px solid var(--line)", width: "100%" }} />

        <p className="note">
          <strong>Message text.</strong> Use <code>{"{round}"}</code> <code>{"{days}"}</code> <code>{"{expiry}"}</code>{" "}
          <code>{"{type}"}</code> anywhere. In the game line you can also use <code>{"{n}"}</code> <code>{"{white}"}</code>{" "}
          <code>{"{black}"}</code> <code>{"{url}"}</code>. Parts are separated by a blank line.
        </p>
        <div>
          <label htmlFor="tpl-header">Opening</label>
          <textarea id="tpl-header" className="small" value={templates.header}
            onChange={(e) => setTemplate("header", e.target.value)} />
        </div>
        <div>
          <label htmlFor="tpl-game">Each game</label>
          <textarea id="tpl-game" className="small" value={templates.game}
            onChange={(e) => setTemplate("game", e.target.value)} />
        </div>
        <div>
          <label htmlFor="tpl-bye">Bye (only shown when someone sits out; use {"{bye}"} for the name)</label>
          <textarea id="tpl-bye" className="small" value={templates.bye}
            onChange={(e) => setTemplate("bye", e.target.value)} />
        </div>
        <div>
          <label htmlFor="tpl-footer">Closing</label>
          <textarea id="tpl-footer" className="small" value={templates.footer}
            onChange={(e) => setTemplate("footer", e.target.value)} />
        </div>
        <button className="secondary" type="button"
          onClick={() => { setTemplates(null); flash("ok", "Message text reset to config.json."); }}>
          Reset message text
        </button>
      </div>
    </details>
  );
}

/* ====================================================================
   APP
==================================================================== */

/* ====================================================================
   GAME STATUS (weekly update)
==================================================================== */

const pick = (list) => list[Math.floor(Math.random() * list.length)];

// "https://lichess.org/AbCdEfGh" -> "AbCdEfGh" (the id stays the same after the challenge is accepted)
const gameIdOf = (url) => url?.match(/lichess\.org\/([A-Za-z0-9]{8})/)?.[1];

// Absolute deadline in Italian time, e.g. "mercoledì alle 21:40"
function formatDeadline(ms) {
  const parts = new Intl.DateTimeFormat("it-IT", {
    timeZone: "Europe/Rome", weekday: "long", hour: "2-digit", minute: "2-digit", hourCycle: "h23",
  }).formatToParts(new Date(ms));
  const get = (type) => parts.find((p) => p.type === type)?.value;
  return `${get("weekday")} alle ${get("hour")}:${get("minute")}`;
}

// Asks Lichess for the current state of the games (public data, no token needed).
// Games that are not on Lichess yet (link not accepted) are simply missing from the answer.
async function fetchGameStates(ids) {
  const res = await fetch("https://lichess.org/api/games/export/_ids?pgnInJson=false&lastFen=true&opening=true", {
    method: "POST",
    headers: { "Content-Type": "text/plain", Accept: "application/x-ndjson" },
    body: ids.join(","),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const states = {};
  (await res.text()).split("\n").filter((l) => l.trim()).forEach((line) => {
    try { const g = JSON.parse(line); states[g.id] = g; } catch (e) {}
  });
  return states;
}

// How a game ended, in Italian, as a fragment that follows "ha vinto X ..."
const HOW_WIN = { mate: "con il matto", resign: "per abbandono", outoftime: "per tempo scaduto", timeout: "per abbandono" };
const HOW_DRAW = { stalemate: "per stallo" };

// cleans up after empty placeholders: "()" removed, repeated spaces and blank lines collapsed
const tidy = (t) => t.replace(/\(\s*\)/g, "").replace(/[ \t]+/g, " ").replace(/ ?\n ?/g, "\n").replace(/\n+/g, "\n").trim();

// Lichess user id (lowercase) -> our handle from config.json
const idToHandle = (id) => PLAYERS.find((p) => p.handle.toLowerCase() === String(id ?? "").toLowerCase())?.handle;

// Returns { text, details }: the message, and one technical line per game to double-check it.
function buildStatusMessage({ games, states, round, defaultDays }) {
  const count = { finished: 0, ongoing: 0, pending: 0 };
  const details = [];
  const finishedInfo = []; // for the highlights

  // random phrase from a list; inside one message the same phrase is not used twice until the list runs out
  const used = {};
  const pickFor = (key) => {
    const list = STATUS_PHRASES[key];
    const seen = (used[key] ??= new Set());
    if (seen.size >= list.length) seen.clear();
    let i;
    do { i = Math.floor(Math.random() * list.length); } while (seen.has(i));
    seen.add(i);
    return list[i];
  };

  const blocks = games.map((g, i) => {
    const id = gameIdOf(g.url);
    const s = states[id];
    // Colors exactly as they are on Lichess; the colors saved when the game was created are only a fallback.
    const white = idToHandle(s?.players?.white?.user?.id) ?? g.white;
    const black = idToHandle(s?.players?.black?.user?.id) ?? g.black;
    const head = `${KEYCAPS[i] ?? i + 1 + "."} ${nameOf(white)} ⚪ vs ${nameOf(black)} ⚫`;
    let body;

    if (!s) {
      count.pending++;
      body = pickFor("pending");
      details.push(`${i + 1}. ${id}: not found on Lichess (link not accepted yet?)`);
    } else if (s.status === "created" || s.status === "started") {
      count.ongoing++;
      const plies = s.moves && s.moves.trim() ? s.moves.trim().split(/\s+/).length : 0;
      // Best effort only: for games in progress Lichess hides the most recent moves in exports, so {turn} and
      // {move} can lag behind the real game. The default phrases in config.json do not use them.
      // whose turn: from the last position (FEN) when Lichess provides it, otherwise from the number of moves
      const fen = typeof s.lastFen === "string" ? s.lastFen.trim().split(/\s+/) : [];
      const hasFen = fen[1] === "w" || fen[1] === "b";
      const whiteToMove = hasFen ? fen[1] === "w" : plies % 2 === 0;
      const fenMove = parseInt(fen[5], 10);
      const move = hasFen && Number.isFinite(fenMove) ? fenMove : Math.floor(plies / 2) + 1;
      const days = s.daysPerTurn ?? defaultDays;
      const deadlineMs = (s.lastMoveAt ?? s.createdAt) + days * 86400000;
      body = fill(pickFor("ongoing"), {
        move,
        turn: nameOf(whiteToMove ? white : black),
        deadline: deadlineMs < Date.now() ? "adesso (tempo scaduto)" : formatDeadline(deadlineMs),
      });
      details.push(
        `${i + 1}. ${id}: white=${s.players?.white?.user?.name ?? "?"}, black=${s.players?.black?.user?.name ?? "?"}, ` +
        `half-moves=${plies}, to move=${whiteToMove ? "white" : "black"} (from ${hasFen ? "position" : "move count"}), ` +
        `last move at ${s.lastMoveAt ? new Date(s.lastMoveAt).toLocaleString("it-IT", { timeZone: "Europe/Rome" }) : "?"}, ` +
        `saved at creation: ${g.white} white / ${g.black} black`
      );
    } else if (s.status === "aborted" || s.status === "noStart") {
      body = pickFor("aborted");
      details.push(`${i + 1}. ${id}: status ${s.status}`);
    } else {
      count.finished++;
      const plies = s.moves && s.moves.trim() ? s.moves.trim().split(/\s+/).length : 0;
      const moves = Math.ceil(plies / 2);
      const movesText = moves > 0 ? `in ${moves} ${moves === 1 ? "mossa" : "mosse"}` : "";
      const opening = s.opening?.name ?? "";
      const common = { moves, opening, openingNote: opening ? `Apertura: ${opening}` : "" };
      const won = s.winner === "white" || s.winner === "black";

      if (won) {
        const winnerHandle = s.winner === "white" ? white : black;
        const loserHandle = s.winner === "white" ? black : white;
        const color = s.winner === "white" ? "col bianco" : "col nero";
        const how = HOW_WIN[s.status] ?? "";
        body = tidy(fill(pickFor("win"), {
          ...common,
          winner: nameOf(winnerHandle),
          loser: nameOf(loserHandle),
          result: s.winner === "white" ? "1-0" : "0-1",
          color,
          how,
          details: [color, how, movesText].filter(Boolean).join(" "),
        }));
      } else {
        const how = HOW_DRAW[s.status] ?? "";
        body = tidy(fill(pickFor("draw"), {
          ...common,
          result: "½-½",
          how,
          details: [how, movesText].filter(Boolean).join(" "),
        }));
      }
      finishedInfo.push({ names: `${nameOf(white)}–${nameOf(black)}`, moves });
      details.push(`${i + 1}. ${id}: status ${s.status}, winner ${s.winner ?? "none"}, moves ${moves}, opening ${opening || "n/a"}`);
    }
    return `${head}\n${body}`;
  });

  // longest and shortest finished game, only with at least two finished games of different length
  let highlight = "";
  const timed = finishedInfo.filter((x) => x.moves > 0).sort((a, b) => a.moves - b.moves);
  if (STATUS_PHRASES.highlight && timed.length >= 2 && timed[0].moves !== timed[timed.length - 1].moves) {
    const label = (x) => `${x.names} (${x.moves} mosse)`;
    highlight = fill(pickFor("highlight"), { longest: label(timed[timed.length - 1]), shortest: label(timed[0]) });
  }

  const text = [
    fill(pickFor("header"), { round }),
    ...blocks,
    highlight,
    fill(pickFor("footer"), count),
    pickFor("closing"),
  ].filter(Boolean).join("\n\n");
  return { text, details };
}

// Reads a round message (as posted in the group) and extracts the round number and the games.
// For each Lichess link, the two players named in the text just before it are taken as white (first) and black (second).
function parseRoundMessage(text) {
  const escapeRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const round = text.match(/(?:turno|round)\s*(\d+)/i)?.[1] ?? "";
  const linkRe = /https?:\/\/lichess\.org\/([A-Za-z0-9]{8})(?![A-Za-z0-9])/g;
  const games = [];
  const problems = [];
  let previousEnd = 0;
  let n = 0;
  let match;

  while ((match = linkRe.exec(text))) {
    n++;
    const segment = text.slice(previousEnd, match.index);
    previousEnd = match.index + match[0].length;

    // position of each known player in the text before this link (by display name or by Lichess handle)
    const found = PLAYERS.map((p) => {
      let best = -1;
      [p.name, p.handle].forEach((label) => {
        const re = new RegExp("(^|[^\\p{L}\\p{N}])" + escapeRe(label) + "(?![\\p{L}\\p{N}])", "iu");
        const hit = re.exec(segment);
        if (hit) {
          const idx = hit.index + hit[1].length;
          if (best === -1 || idx < best) best = idx;
        }
      });
      return { player: p, idx: best };
    }).filter((x) => x.idx >= 0).sort((a, b) => a.idx - b.idx);

    if (found.length < 2) {
      problems.push(`Link ${n} (${match[1]}): could not recognise the two players, skipped.`);
      continue;
    }
    games.push({ white: found[0].player.handle, black: found[1].player.handle, url: `https://lichess.org/${match[1]}` });
  }
  return { round, games, problems };
}

function StatusPanel({ history, defaultDays, onRecover }) {
  const rounds = [...new Set(history.map((g) => g.round))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  const [chosen, setChosen] = useState("");
  const round = rounds.includes(chosen) ? chosen : rounds[rounds.length - 1] ?? "";
  const [text, setText] = useState("");
  const [details, setDetails] = useState([]);
  const [status, setStatus] = useState({ busy: false, error: "", info: "" });

  // recover games from an old round message
  const [recText, setRecText] = useState("");
  const [recRound, setRecRound] = useState("");
  const [recResult, setRecResult] = useState(null);

  const recover = () => {
    const parsed = parseRoundMessage(recText);
    if (parsed.games.length === 0) {
      return setRecResult({ kind: "err", text: "No Lichess game links found in the text.", items: parsed.problems });
    }
    const roundValue = parsed.round || recRound.trim();
    if (!roundValue) {
      return setRecResult({ kind: "err", text: "I can't find the round number. Type it in the Round field and try again." });
    }
    const { added, skipped } = onRecover(roundValue, parsed.games);
    setChosen(roundValue);
    setRecResult({
      kind: parsed.problems.length ? "err" : "ok",
      text: `Recovered ${added} game${added === 1 ? "" : "s"} for round ${roundValue}` +
        (skipped ? ` (${skipped} already known)` : "") + ".",
      items: parsed.problems,
    });
  };

  const load = async () => {
    const games = history.filter((g) => g.round === round);
    setStatus({ busy: true, error: "", info: "" });
    try {
      const states = await fetchGameStates(games.map((g) => gameIdOf(g.url)).filter(Boolean));
      const built = buildStatusMessage({ games, states, round, defaultDays });
      setText(built.text);
      setDetails(built.details);
      setStatus({ busy: false, error: "", info: "" });
    } catch (e) {
      setStatus({
        busy: false, info: "",
        error: e instanceof TypeError
          ? "Network error. If your connection is fine, the browser may be blocking the request (CORS)."
          : e.message,
      });
    }
  };

  const copy = async () => {
    try { await navigator.clipboard.writeText(text); setStatus((s) => ({ ...s, info: "Copied." })); }
    catch (e) { setStatus((s) => ({ ...s, info: "Could not copy. Select the text and copy it manually." })); }
  };

  return (
    <section className="result">
      <h2>Game status</h2>
      {rounds.length === 0 ? (
        <p className="note">Create some games first: their ids are remembered here. If you lost the data, recover them from an old round message below.</p>
      ) : (
        <>
          <div>
            <label htmlFor="status-round">Round</label>
            <select id="status-round" value={round} onChange={(e) => setChosen(e.target.value)}>
              {rounds.map((r) => <option key={r} value={r}>Round {r}</option>)}
            </select>
          </div>
          <div className="actions">
            <button className="primary" type="button" disabled={status.busy} onClick={load}>
              {status.busy ? "Checking…" : "Check games status"}
            </button>
          </div>
          {status.error && <div className="notice err">{status.error}</div>}
          {text && (
            <>
              <div style={{ marginTop: 14 }}>
                <textarea aria-label="Status message" value={text} onChange={(e) => setText(e.target.value)} />
              </div>
              <div className="actions two">
                <a className="primary" target="_blank" rel="noopener"
                  href={"https://wa.me/?text=" + encodeURIComponent(text)}>Share on WhatsApp</a>
                <button className="secondary" type="button" onClick={copy}>Copy text</button>
              </div>
              {status.info && <div className="notice ok">{status.info}</div>}
              <details>
                <summary>Details for checking</summary>
                <div className="body">
                  <p className="note">What Lichess reported for each game. Use it to double-check who is on move.</p>
                  <ul className="note" style={{ margin: 0, paddingLeft: 18 }}>
                    {details.map((d, i) => <li key={i}>{d}</li>)}
                  </ul>
                </div>
              </details>
            </>
          )}
        </>
      )}

      <details>
        <summary>Recover games from a WhatsApp message</summary>
        <div className="body">
          <p className="note">
            Paste the message you posted when you started a round. Each link is matched with the two players named just before it
            (first = white). Games already known are not duplicated.
          </p>
          <textarea className="small" aria-label="Round message to recover from" value={recText}
            placeholder="Paste the round message here" onChange={(e) => { setRecText(e.target.value); setRecResult(null); }} />
          <div>
            <label htmlFor="rec-round">Round (only needed if the message has no "Turno N")</label>
            <input id="rec-round" type="text" inputMode="numeric" autoComplete="off" value={recRound}
              onChange={(e) => setRecRound(e.target.value)} />
          </div>
          <button className="secondary" type="button" disabled={!recText.trim()} onClick={recover}>Recover games</button>
          {recResult && (
            <div className={"notice " + recResult.kind}>
              {recResult.text}
              {recResult.items?.length > 0 && <ul>{recResult.items.map((t, i) => <li key={i}>{t}</li>)}</ul>}
            </div>
          )}
        </div>
      </details>
    </section>
  );
}

function App() {
  const [round, setRound] = usePersistentState("pairings.round", "1");
  // every game ever created from this page (kept after "Start next round"), used for the status check
  const [history, setHistory] = usePersistentState("pairings.history", [], Array.isArray);
  const [pairs, setPairs] = usePersistentState("pairings.pairs.v2", emptyPairs,
    (v) => Array.isArray(v) && v.length === GAME_COUNT);
  const [storedSettings, setSettings] = usePersistentState("pairings.settings.v3", initialStoredSettings);
  const settings = { ...DEFAULT_SETTINGS, ...storedSettings, rules: { ...DEFAULT_SETTINGS.rules, ...(storedSettings.rules ?? {}) } };
  const [templates, setTemplates] = usePersistentState("pairings.templates.v2", null); // only texts edited in Settings; the rest follows config.json

  const [notice, setNotice] = useState(null);
  const [busy, setBusy] = useState("");      // e.g. "Creating game 2…"
  const [editedText, setEditedText] = useState(null); // manual edits to the message, until it changes
  const settingsRef = useRef(null);
  const resultRef = useRef(null);

  const flash = (kind, text, items) => setNotice({ kind, text, items });

  // add games recovered from an old round message (skips the ones whose id is already known)
  const recoverGames = (roundValue, games) => {
    const known = new Set(history.map((g) => gameIdOf(g.url)));
    const fresh = games.filter((g) => !known.has(gameIdOf(g.url))).map((g) => ({ ...g, round: roundValue }));
    if (fresh.length) setHistory((h) => [...h, ...fresh].slice(-80));
    return { added: fresh.length, skipped: games.length - fresh.length };
  };

  // remember every created game (also the ones already on the page when this feature was added)
  useEffect(() => {
    setHistory((h) => {
      const known = new Set(h.map((g) => g.url));
      const added = pairs
        .filter((p) => p.url && !known.has(p.url))
        .map((p) => ({ round, white: p.white, black: p.black, url: p.url }));
      return added.length ? [...h, ...added].slice(-80) : h;
    });
  }, [pairs]);

  /* ----- pairings ----- */
  const updatePair = (i, patch) => {
    setNotice(null);
    setPairs((prev) => prev.map((p, idx) => (idx === i ? { ...p, ...patch } : p)));
  };
  const swapPair = (i) => updatePair(i, { white: pairs[i].black, black: pairs[i].white });

  const used = new Set(pairs.flatMap((p) => [p.white, p.black]).filter(Boolean));
  // players still free, plus the one currently chosen in this particular dropdown
  const availableFor = (current) => PLAYERS.filter((p) => !used.has(p.handle) || p.handle === current);

  /* ----- message ----- */
  // saved templates from older versions may lack newer parts, so fill gaps from the defaults
  const tpl = { ...DEFAULT_TEMPLATES, ...templates };
  const byes = PLAYERS.filter((p) => !used.has(p.handle)).map((p) => p.name);
  const generated = buildMessage({ pairs, round, settings, templates: tpl, byes });
  useEffect(() => setEditedText(null), [generated]);
  const text = editedText ?? generated;
  const hasCreated = pairs.some((p) => p.url);

  const copyText = async () => {
    try { await navigator.clipboard.writeText(text); flash("ok", "Copied."); }
    catch (e) { flash("err", "Could not copy. Select the text and copy it manually."); }
  };

  /* ----- actions ----- */
  const createGames = async () => {
    setNotice(null);
    if (!settings.token) {
      settingsRef.current.open = true;
      return flash("err", "Add your Lichess API token in Settings first.");
    }
    const todo = pairs.map((p, i) => ({ p, i })).filter(({ p }) => !p.url);
    const ready = todo.filter(({ p }) => p.white && p.black);
    const half = todo.filter(({ p }) => (p.white || p.black) && !(p.white && p.black));
    if (ready.length === 0) return flash("err", "Choose a white and a black player for at least one game.");
    if (half.length && !confirm(`Game ${half.map(({ i }) => i + 1).join(", ")} is incomplete and will be skipped. Continue?`)) return;

    const errors = [];
    for (const { p, i } of ready) {
      setBusy(`Creating game ${i + 1}…`);
      try {
        const url = await createChallenge(p, { round, settings });
        setPairs((prev) => prev.map((x, idx) => (idx === i ? { ...x, url } : x)));
      } catch (e) {
        errors.push(`Game ${i + 1}: ` + (e instanceof TypeError
          ? "network error. If your connection is fine, the browser may be blocking the request (CORS)."
          : e.message));
      }
    }
    setBusy("");
    if (errors.length) {
      flash("err", "Some games were not created. Fix the issue and press Create again; finished games are kept.", errors);
    } else {
      flash("ok", "Games created. Share the message below.");
      setTimeout(() => resultRef.current?.scrollIntoView({ behavior: "smooth", block: "start" }), 50);
    }
  };

  const clearPairs = () => {
    if (hasCreated && !confirm("This removes the created links from this page. The games on Lichess stay open. Clear anyway?")) return;
    setPairs(emptyPairs());
    setNotice(null);
  };

  const nextRound = () => {
    const n = parseInt(round, 10);
    setPairs(emptyPairs());
    if (Number.isFinite(n)) setRound(String(n + 1));
    setNotice(null);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  return (
    <main>
      <h1>Round pairings</h1>
      <p className="sub">Pick the pairings, create the games, share the links.</p>
      <div className="strip" aria-hidden="true" />

      <div style={{ marginBottom: 16 }}>
        <label htmlFor="round">Round</label>
        <input id="round" type="text" inputMode="numeric" autoComplete="off" value={round}
          onChange={(e) => setRound(e.target.value)} />
      </div>

      {pairs.map((pair, i) => (
        <GameCard key={i} index={i} pair={pair} available={availableFor}
          onChange={(patch) => updatePair(i, patch)} onSwap={() => swapPair(i)} />
      ))}
      <p className="progress">{used.size} of {PLAYERS.length} players placed</p>

      <button className="primary" type="button" disabled={!!busy} onClick={createGames}>
        {busy || "Create games"}
      </button>
      <div className="actions">
        <button className="secondary" type="button" onClick={clearPairs}>Clear pairings</button>
      </div>
      <Notice notice={notice} />

      {hasCreated && (
        <section className="result" ref={resultRef}>
          <h2>Message for the group</h2>
          <textarea aria-label="Message for the group" value={text} onChange={(e) => setEditedText(e.target.value)} />
          <div className="actions two">
            <a className="primary" target="_blank" rel="noopener"
              href={"https://wa.me/?text=" + encodeURIComponent(text)}>Share on WhatsApp</a>
            <button className="secondary" type="button" onClick={copyText}>Copy text</button>
          </div>
          <div className="actions">
            <button className="secondary" type="button" onClick={nextRound}>Start next round</button>
          </div>
        </section>
      )}

      <StatusPanel history={history} defaultDays={settings.days} onRecover={recoverGames} />

      <SettingsPanel settings={settings} setSettings={setSettings} templates={tpl}
        setTemplates={setTemplates} flash={flash} panelRef={settingsRef} />
    </main>
  );
}

function ConfigError({ message }) {
  return (
    <main>
      <h1>Round pairings</h1>
      <div className="notice err" role="alert">{message}</div>
    </main>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<main><p className="sub">Loading…</p></main>);

fetch("config.json", { cache: "no-cache" })
  .then((res) => {
    if (!res.ok) throw new Error(`config.json not found (HTTP ${res.status}). It must sit in the same folder as index.html.`);
    return res.json();
  })
  .then((cfg) => { applyConfig(cfg); root.render(<App />); })
  .catch((e) => {
    const message =
      e instanceof SyntaxError ? "config.json is not valid JSON (check commas and quotes): " + e.message :
      e instanceof TypeError ? "Could not load config.json. Open the page from its web address, not as a local file." :
      e.message;
    root.render(<ConfigError message={message} />);
  });
</script>
</body>
</html>
