name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
  # Rebuild every 3 hours so the link preview image (og.png) shows the current standings
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Test
        run: npm test

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build
        run: npm run build
        env:
          # Absolute site address for the og:image tag of the link preview
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # GitHub disables scheduled workflows of a public repository after 60 days without
  # commits. Re-enabling it on every scheduled run resets that counter, with no commit.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the scheduled deploy enabled
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
